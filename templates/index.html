<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Planner</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════
     HEADER
════════════════════════════════════════════ -->
<header>
  <div class="header-inner">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="12" stroke="#4fc3f7" stroke-width="1.5"/>
        <ellipse cx="14" cy="14" rx="12" ry="4.5" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="3 2"/>
        <circle cx="14" cy="14" r="2.5" fill="#4fc3f7"/>
        <circle cx="24.5" cy="10" r="1.8" fill="#ff8a65"/>
      </svg>
      <span>Mission Planner</span>
    </div>
    <nav>
      <button class="nav-btn active" onclick="showPanel('config')">Configure</button>
      <button class="nav-btn" onclick="showPanel('viewer')" id="btn-viewer" disabled>Simulation</button>
    </nav>
  </div>
</header>

<!-- ═══════════════════════════════════════════
     CONFIG PANEL
════════════════════════════════════════════ -->
<div id="panel-config" class="panel active">
  <div class="config-layout">

    <!-- LEFT COLUMN -->
    <div class="config-col">

      <!-- Vehicle name -->
      <section class="card">
        <h2>Vehicle</h2>
        <div class="rocket-presets" id="rocket-presets">
          <button type="button" class="preset-btn rocket-preset-btn active" onclick="selectRocketPreset(this,'falcon9')">Falcon 9</button>
          <button type="button" class="preset-btn rocket-preset-btn" onclick="selectRocketPreset(this,'falconheavy')">Falcon Heavy</button>
          <button type="button" class="preset-btn rocket-preset-btn" onclick="selectRocketPreset(this,'ariane5')">Ariane 5</button>
          <button type="button" class="preset-btn rocket-preset-btn" onclick="selectRocketPreset(this,'saturnv')">Saturn V</button>
          <button type="button" class="preset-btn rocket-preset-btn" onclick="selectRocketPreset(this,'custom')">Custom</button>
        </div>
        <div class="field">
          <label>Vehicle name</label>
          <input type="text" id="vehicle-name" value="Falcon 9" placeholder="e.g. Falcon 9">
        </div>
        <div class="field">
          <label>Payload mass (kg)</label>
          <input type="number" id="payload-mass" value="22800" min="0">
        </div>
      </section>

      <!-- Dynamic stages -->
      <section class="card">
        <h2>Stages</h2>
        <div id="stages-container"></div>
        <button type="button" class="add-stage-btn" onclick="addStage()">+ Add stage</button>
      </section>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="config-col">

      <!-- Target orbit -->
      <section class="card">
        <h2>Target orbit</h2>
        <div class="orbit-presets">
          <button class="preset-btn active" onclick="selectOrbit(this,'iss',400)">ISS<span>400 km</span></button>
          <button class="preset-btn" onclick="selectOrbit(this,'sso',600)">SSO<span>600 km</span></button>
          <button class="preset-btn" onclick="selectOrbit(this,'meo',20000)">MEO<span>20 000 km</span></button>
          <button class="preset-btn" onclick="selectOrbit(this,'geo',35786)">GEO<span>35 786 km</span></button>
          <button class="preset-btn" onclick="selectOrbit(this,'custom',null)">Custom<span>—</span></button>
        </div>
        <div class="field" id="custom-alt-field" style="display:none;margin-top:12px">
          <label>Altitude (km)</label>
          <input type="number" id="custom-alt" value="500" min="100" max="100000">
        </div>
        <div class="orbit-info" id="orbit-info">
          <span id="orbit-label">ISS — 400 km LEO</span>
          <span id="orbit-v" class="dim">v<sub>circ</sub> ≈ 7.67 km/s</span>
        </div>
      </section>

      <!-- Guidance -->
      <section class="card">
        <h2>Guidance</h2>
        <div class="field">
          <label>Vertical ascent duration (s)</label>
          <input type="number" id="t-vertical" value="20" min="5" max="60">
        </div>
      </section>

      <!-- Simulation settings -->
      <section class="card">
        <h2>Simulation</h2>
        <div class="field">
          <label>Orbits to show</label>
          <input type="number" id="n-orbits" value="1.5" step="0.5" min="0.5" max="5">
        </div>
      </section>

      <!-- Launch button -->
      <button class="launch-btn" id="launch-btn" onclick="runSimulation()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2"/>
          <path d="M12 8v8M8 12l4-4 4 4"/>
        </svg>
        Launch simulation
      </button>

      <div id="status-bar" class="status-bar hidden">
        <div class="spinner"></div>
        <span id="status-msg">Running simulation…</span>
      </div>

    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     VIEWER PANEL
════════════════════════════════════════════ -->
<div id="panel-viewer" class="panel">
  <div class="viewer-layout">

    <!-- 3D plot -->
    <div class="plot-area">
      <div id="plot3d"></div>
    </div>

    <!-- Right sidebar -->
    <div class="sidebar">

      <!-- Mission clock / phase -->
      <div class="hud-card" id="hud">
        <div class="hud-clock" id="hud-clock">T+ 00:00</div>
        <div class="hud-phase" id="hud-phase">—</div>
        <div class="hud-row"><span class="hud-label">Altitude</span><span class="hud-val" id="hud-alt">—</span></div>
        <div class="hud-row"><span class="hud-label">Speed</span><span class="hud-val" id="hud-speed">—</span></div>
        <div class="hud-row"><span class="hud-label">Acceleration</span><span class="hud-val" id="hud-accel">—</span></div>
        <div class="hud-row"><span class="hud-label">Downrange</span><span class="hud-val" id="hud-downrange">—</span></div>
        <div class="hud-row"><span class="hud-label">Mass</span><span class="hud-val" id="hud-mass">—</span></div>
      </div>

      <!-- Mission summary (shown after sim) -->
      <div class="card" id="summary-card" style="display:none">
        <h2>Mission summary</h2>
        <table class="summary-table" id="summary-table"></table>
      </div>

      <!-- Orbital elements -->
      <div class="card" id="orbital-card" style="display:none">
        <h2>Orbital elements</h2>
        <table class="summary-table" id="orbital-table"></table>
      </div>

      <!-- Back button -->
      <button class="back-btn" onclick="showPanel('config')">← Reconfigure</button>
    </div>
  </div>
</div>

<script src="/static/main.js"></script>
</body>
</html>
